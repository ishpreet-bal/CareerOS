# Free GitHub Actions allowance only (architecture amendment A6):
# one Linux job, one Python version, short timeout, superseded runs cancelled.
# No secrets, no deployment, no external services, no real model calls.
name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CAREEROS_EXECUTION_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Type-check
        run: python -m mypy
      - name: Test
        run: python -m pytest
