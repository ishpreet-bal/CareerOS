# Routing policy per task type. Consumed by the router (M4); validated from M1.
quality_floors: {low: 0.60, normal: 0.75, high: 0.85, critical: 0.92}
exploration_rate: 0.05
prior_strength: 4.0

task_types:
  job.normalize:            {base_complexity: 0.05, min_tier: 3, default_effort: none}
  job.classify_role:        {base_complexity: 0.20, min_tier: 3, default_effort: none}
  job.analyze:              {base_complexity: 0.35, min_tier: 3, default_effort: none}
  eligibility.assess:       {base_complexity: 0.30, min_tier: 3, default_effort: none}
  research.company:         {base_complexity: 0.50, min_tier: 2, default_effort: low}
  match.rationale:          {base_complexity: 0.40, min_tier: 3, default_effort: none}
  resume.tailor:            {base_complexity: 0.60, min_tier: 2, default_effort: low, important: true}
  cover_letter.draft:       {base_complexity: 0.65, min_tier: 2, default_effort: medium, important: true}
  application.answers:      {base_complexity: 0.55, min_tier: 2, default_effort: low, important: true}
  quality.review:           {base_complexity: 0.50, min_tier: 2, default_effort: low}
  manager.plan_novel:       {base_complexity: 0.80, min_tier: 1, default_effort: medium, deterministic_first: true}
  manager.strategic_review: {base_complexity: 0.85, min_tier: 1, default_effort: high}
